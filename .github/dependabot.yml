version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 6.1.0 turns every `pnpm …` step into a silent no-op on windows-latest (2026-09-21).
      - dependency-name: pnpm/action-setup
        versions: [">= 6.1.0"]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
