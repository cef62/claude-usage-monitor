name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  version-or-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # With pending changesets: opens/updates the "Version Packages" PR.
      # Without: runs `changeset git-tag` and pushes the new vX.Y.Z tag.
      # GitHub Releases are created by build-release.yml, not here.
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release:tag
          create-github-releases: false
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

      # A tag pushed with GITHUB_TOKEN never triggers `on: push: tags`, so start the
      # build explicitly for the tag that was just created.
      - if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-release.yml --ref "v$(node -p "require('./package.json').version")"
