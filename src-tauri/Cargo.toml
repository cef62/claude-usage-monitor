[package]
name = "claude-usage-monitor"
# Deliberately not the product version. That lives in tauri.conf.json and package.json.
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.11"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# tray-icon 0.24.2 plus upstream PR #365 (macOS 27 swallows left clicks when the NSMenu stays
# attached to the NSStatusItem). Drop this and `vendor/` once Tauri depends on tray-icon 0.25.
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
